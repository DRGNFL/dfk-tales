<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFK Legion Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0812;
  color: #dbe3e8;
  font-family: 'Lora', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  gap: 20px;
}
h1 {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(0.5rem, 2vw, 0.7rem);
  color: #c9a84c;
  letter-spacing: 0.15em;
  text-shadow: 0 0 20px rgba(201,168,76,0.4);
  text-align: center;
}
.subtitle { font-size: 0.85rem; color: #555; font-style: italic; text-align: center; margin-top: -12px; }
.search-box { display:flex; gap:10px; width:100%; max-width:600px; flex-wrap:wrap; justify-content:center; }
input[type=text] {
  flex:1; min-width:260px;
  background:#1a1530; border:1px solid #333; color:#dbe3e8;
  padding:10px 16px; font-family:'Lora',serif; font-size:0.9rem;
  border-radius:6px; outline:none;
}
input[type=text]:focus { border-color:#c9a84c; }
input[type=text]::placeholder { color:#444; }
.btn {
  background:linear-gradient(135deg,#2a1850,#4a2880);
  border:1px solid #c9a84c; color:#c9a84c;
  padding:10px 20px; font-family:'Press Start 2P',monospace;
  font-size:0.4rem; border-radius:6px; cursor:pointer;
  transition:all 0.2s; white-space:nowrap;
}
.btn:hover { background:linear-gradient(135deg,#3a2860,#5a38a0); }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
.chain-badges { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.badge { font-family:'Press Start 2P',monospace; font-size:0.35rem; padding:4px 10px; border-radius:12px; border:1px solid; }
.badge-dfk { background:rgba(100,160,255,0.1); color:#64a0ff; border-color:#64a0ff44; }
.badge-metis { background:rgba(0,210,190,0.1); color:#00d2be; border-color:#00d2be44; }
.badge-count { background:rgba(201,168,76,0.1); color:#c9a84c; border-color:#c9a84c44; }
.status { font-size:0.8rem; color:#888; font-style:italic; text-align:center; min-height:20px; }
.status.loading { color:#c9a84c; }
.status.error { color:#cc4444; }
.status.ok { color:#44cc88; }
.cards-grid { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; width:100%; max-width:1200px; }

/* CARD */
.heroCard {
  width:200px; background:#100f21; border-radius:6px;
  overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.8);
  transition:transform 0.2s, box-shadow 0.2s; cursor:default;
}
.heroCard:hover { transform:translateY(-4px); box-shadow:0 8px 32px rgba(0,0,0,0.8); }
.heroFrame {
  width:200px; height:186px; position:relative;
  background-color:#1e1830;
  display:flex; align-items:center; justify-content:center;
  image-rendering:pixelated;
}
.chain-tag {
  position:absolute; top:6px; right:6px;
  font-family:'Press Start 2P',monospace; font-size:0.3rem;
  padding:2px 6px; border-radius:8px; z-index:20;
}
.tag-dfk { background:rgba(100,160,255,0.85); color:#fff; }
.tag-metis { background:rgba(0,210,190,0.85); color:#000; }
.bg-water{background-color:#0e1a28} .bg-fire{background-color:#281208}
.bg-earth{background-color:#121a08} .bg-wind{background-color:#081a14}
.bg-lightning{background-color:#140e28} .bg-ice{background-color:#0e1828}
.bg-light{background-color:#1a180a} .bg-dark{background-color:#080810}
.hc { width:120px; height:180px; position:relative; image-rendering:pixelated; }
.L { position:absolute; top:0; left:0; width:120px; height:180px; pointer-events:none; }
.L svg { position:absolute; top:0; left:0; width:120px; height:180px; }
.z1{z-index:1} .z2{z-index:2} .z3{z-index:3} .z5{z-index:5}
.z6{z-index:6} .z7{z-index:7} .z8{z-index:8} .z10{z-index:10}
.eyes { position:absolute; left:48px; height:12px; width:20px; overflow:hidden; z-index:8; }
.eyes svg { position:absolute; top:0; left:0; width:20px; height:12px; }
.heroInfo { background:#100f21; padding:8px 12px 10px; border-top:1px solid #1a1830; }
.heroName { font-family:'Press Start 2P',monospace; font-size:0.38rem; color:#dbe3e8; text-align:center; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.heroMeta { display:flex; justify-content:space-between; font-size:0.65rem; color:#a09070; margin-bottom:6px; }
.bars { display:flex; flex-direction:column; gap:3px; margin-bottom:6px; }
.bar-row { display:flex; align-items:center; gap:5px; }
.bar-lbl { width:24px; color:#555; font-size:0.38rem; font-family:'Press Start 2P',monospace; }
.bar-bg { flex:1; height:4px; background:#111; border-radius:2px; overflow:hidden; }
.bar-f { height:100%; border-radius:2px; }
.c-sum{background:#ff88aa} .c-sta{background:#ffaa44} .c-xp{background:#44cc88}
.hbot { display:flex; justify-content:space-between; font-size:0.6rem; }
.hp{color:#cc4444} .mp{color:#4488cc} .hid{color:#333; font-size:0.45rem; cursor:pointer;}
.hid:hover{color:#888;}
</style>
</head>
<body>
<h1>⚔ DFK LEGION VIEWER ⚔</h1>
<p class="subtitle">Enter a wallet address to view your legion</p>

function getName(fn, ln) {
  return (FIRST_NAMES[fn % FIRST_NAMES.length]||'Hero')+' '+(LAST_NAMES[ln % LAST_NAMES.length]||'Unknown');
}

function decodeGenes(bigIntStr) {
  let n = BigInt(bigIntStr);
  const genes = [];
  for (let i=0;i<48;i++){genes.push(Number(n%32n));n=n/32n;}
  genes.reverse();
  const groups=[];
  for(let i=0;i<12;i++) groups.push(genes.slice(i*4,i*4+4));
  return groups;
}

function parseVisualGenes(vg) {
  try {
    const g = decodeGenes(vg.toString());
    return { gender:g[11][0], hairStyle:g[7][0], hairColor:g[6][0], eyeColor:g[4][0], skinColor:g[3][0] };
  } catch(e) { return {gender:1,hairStyle:0,hairColor:0,eyeColor:0,skinColor:0}; }
}

function makeSvg(key, hex) {
  const d=D[key]; if(!d||!d.paths) return '';
  let p=d.paths;
  if(hex) p=p.replace(/stroke="current"/g,`stroke="#${hex}"`).replace(/stroke='current'/g,`stroke='#${hex}'`);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${d.viewBox||VB}" shape-rendering="crispEdges">${p}</svg>`;
}
function skinSvg(path,hex){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${VB}" shape-rendering="crispEdges"><path stroke="#${hex}" d="${path}"/></svg>`;}
function eyeSvg(key,hex){
  const d=D[key]; if(!d) return '';
  let p=d.paths.replace(/stroke="current"/g,`stroke="#${hex}"`);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 19 12 4" shape-rendering="crispEdges" width="20" height="12">${p}</svg>`;
}
function ck(g,cls,part){
  const adv=['paladin','darkKnight','summoner','ninja'];
  const elite=['dragoon','sage'];
  const leg=['dreadKnight'];
  let folder='clothes';
  if(adv.includes(cls)) folder='clothes/advanced';
  else if(elite.includes(cls)) folder='clothes/elite';
  else if(leg.includes(cls)) folder='clothes/legendary';
  const c=cls==='dreadKnight'?'dreadknight':cls;
  return `${g}/${folder}/${c}-${part}`;
}
function L(z,...svgs){return `<div class="L z${z}">${svgs.join('')}</div>`;}

function renderHero(hero, chainKey) {
  const vg = parseVisualGenes(hero.visualGenes);
  const g = vg.gender===0?'male':'female';
  const skin=(SKIN_COLORS[vg.skinColor]||'#c58135').replace('#','');
  const hair=(HAIR_COLORS[vg.hairStyle]||'#62a7e6').replace('#','');
  const eye=(EYE_COLORS[vg.eyeColor]||'#203997').replace('#','');
  const cls=CLASS_KEYS[hero.class]||'warrior';
  const SK=D[`_${g}_skin`]||{};

  // element from statGenes bit 0-3
  let elemIdx = 0;
  try { elemIdx = Number(BigInt(hero.statGenes) % 16n); } catch(e){}
  const element = ELEMENTS[elemIdx]||'fire';
  const bgClass = ELEMENT_BG[element]||'bg-dark';
  const border = RARITY_BORDER[hero.rarity||0]||'#666';
  const name = getName(hero.firstName, hero.lastName);
  const clsName = CLASSES[hero.class]||'Warrior';
  const tag = chainKey==='dfkchain'?'CV':'MT';
  const tagCls = chainKey==='dfkchain'?'tag-dfk':'tag-metis';

  const xpMax = [0,2000,4000,8000,16000,32000,64000,128000,256000,512000,1024000][Math.min(hero.level||0,10)]||2000;
  const xpPct = Math.min(100,Math.round((hero.xp||0)/xpMax*100));
  const sumPct = hero.maxSummons>0?Math.round((hero.summons||0)/hero.maxSummons*100):0;

  return `<div class="heroCard" style="border:1px solid ${border}33">
    <div class="heroFrame ${bgClass}">
      <span class="chain-tag ${tagCls}">${tag}</span>
      <div class="hc ${g} ${cls}">
        ${L(1,makeSvg(`${g}/hair/hair${vg.hairStyle}-back-base`,hair),makeSvg(`${g}/hair/hair${vg.hairStyle}-backbase`,hair),makeSvg(`${g}/hair/hair${vg.hairStyle}-back-highlight`,hair),makeSvg(`${g}/hair/hair${vg.hairStyle}-back-shadow`,hair))}
        ${L(2,makeSvg(ck(g,cls,'Behind')))}
        ${L(3,makeSvg(ck(g,cls,'RightArmTop')),makeSvg(`${g}/RightArmTop-highlight`),makeSvg(`${g}/RightArmTop-shadow`),SK.rightArmTop?skinSvg(SK.rightArmTop,skin):'',makeSvg(ck(g,cls,'RightArmBtm')),makeSvg(`${g}/RightArmBtm-highlight`),makeSvg(`${g}/RightArmBtm-shadow`),SK.rightArmBtm?skinSvg(SK.rightArmBtm,skin):'')}

        ${L(6,makeSvg(`${g}/undies-${g}`),makeSvg(ck(g,cls,'Body')),makeSvg(`${g}/Body-highlight`),makeSvg(`${g}/Body-shadow`),SK.body?skinSvg(SK.body,skin):'')}
        ${L(6,makeSvg(ck(g,cls,'LeftArmTop')),makeSvg(`${g}/LeftArmTop-highlight`),makeSvg(`${g}/LeftArmTop-shadow`),SK.leftArmTop?skinSvg(SK.leftArmTop,skin):'',makeSvg(ck(g,cls,'LeftArmBtm')),makeSvg(`${g}/LeftArmBtm-highlight`),makeSvg(`${g}/LeftArmBtm-shadow`),SK.leftArmBtm?skinSvg(SK.leftArmBtm,skin):'')}
        ${L(3,makeSvg(ck(g,cls,'LeftFoot')),makeSvg(ck(g,cls,'RightFoot')),makeSvg(`${g}/Feet-highlight`),makeSvg(`${g}/Feet-shadow`),SK.leftFoot?skinSvg(SK.leftFoot,skin):'',SK.rightFoot?skinSvg(SK.rightFoot,skin):'')}

const DFK_GRAPH = 'https://api.thegraph.com/subgraphs/name/defikingdoms/defikingdoms-dfkchain';
const METIS_GRAPH = 'https://api.thegraph.com/subgraphs/name/defikingdoms/defikingdoms-metis';

async function fetchHeroesByOwner(wallet, graphUrl, chainKey) {
  const query = `{
    heroes(first:100, where:{owner:"${wallet.toLowerCase()}"}) {
      id
      visualGenes
      statGenes
      rarity
      generation
      firstName
      lastName
      level
      xp
      hp
      mp
      stamina
      maxStamina
      summons
      maxSummons
      class
      subClass
    }
  }`;

  try {
    const res = await fetch(graphUrl, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query}),
    });
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.data?.heroes) return [];
    return data.data.heroes.map(h => ({...h, chain: chainKey}));
  } catch(e) {
    console.warn(chainKey, e);
    return [];
  }
}

// Fallback: direct RPC via ethers from CDN
async function fetchViaRPC(wallet, chainKey) {
  const RPCS = {
    dfkchain: 'https://subnets.avax.network/defi-kingdoms/dfk-chain/rpc',
    metis: 'https://andromeda.metis.io/?owner=1088',
  };
  const CONTRACTS = {
    dfkchain: '0xEb9B61B145D6489Be575D3603F4a704810e143dF',
    metis: '0x3bcB5D2dB0D7Fc69B5cB9cc0D68Ab4EFAdFC68f',
  };
  
  if (typeof ethers === 'undefined') return [];
  
  const provider = new ethers.providers.JsonRpcProvider(RPCS[chainKey]);
  const abi = [
    'function getUserHeroes(address _address) external view returns (uint256[])',
    'function getHero(uint256 _id) view returns (tuple(uint256 id, tuple(uint256 summonedTime,uint256 nextSummonTime,uint256 summonerId,uint256 assistantId,uint32 summons,uint32 maxSummons) summoningInfo, tuple(uint256 statGenes,uint256 visualGenes,uint8 rarity,bool shiny,uint16 generation,uint32 firstName,uint32 lastName,uint8 shinyStyle,uint8 class,uint8 subClass) info, tuple(uint256 staminaFullAt,uint256 hpFullAt,uint256 mpFullAt,uint16 level,uint64 xp,address currentQuest,uint8 sp,uint8 status) state, tuple(uint16 strength,uint16 intelligence,uint16 wisdom,uint16 luck,uint16 agility,uint16 vitality,uint16 endurance,uint16 dexterity,uint16 hp,uint16 mp,uint16 stamina) stats) hero)',
  ];
  
  const contract = new ethers.Contract(CONTRACTS[chainKey], abi, provider);
  
  try {
    const ids = await contract.getUserHeroes(wallet);
    const heroes = [];
    for (const id of ids.slice(0, 100)) {
      try {
        const raw = await contract.getHero(id.toString());
        heroes.push({
          id: id.toString(),
          visualGenes: raw.hero.info.visualGenes.toString(),
          statGenes: raw.hero.info.statGenes.toString(),
          rarity: raw.hero.info.rarity,
          generation: raw.hero.info.generation,
          firstName: raw.hero.info.firstName,
          lastName: raw.hero.info.lastName,
          level: raw.hero.state.level,
          xp: raw.hero.state.xp.toNumber ? raw.hero.state.xp.toNumber() : Number(raw.hero.state.xp),
          hp: raw.hero.stats.hp,
          mp: raw.hero.stats.mp,
          stamina: raw.hero.stats.stamina,
          maxStamina: raw.hero.stats.stamina,
          summons: raw.hero.summoningInfo.summons,
          maxSummons: raw.hero.summoningInfo.maxSummons,
          class: raw.hero.info.class,
          subClass: raw.hero.info.subClass,
          chain: chainKey,
        });
      } catch(e) { console.warn('hero failed', id.toString()); }
    }
    return heroes;
  } catch(e) {
    console.warn('getUserHeroes failed', chainKey, e.message);
    return [];
  }
}

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function loadLegion() {
  const wallet = document.getElementById('walletInput').value.trim();
  if (!wallet || !wallet.startsWith('0x') || wallet.length !== 42) {
    setStatus('Please enter a valid wallet address (0x...42 chars)', 'error');
    return;
  }

  document.getElementById('searchBtn').disabled = true;
  document.getElementById('cardsGrid').innerHTML = '';
  document.getElementById('chainBadges').style.display = 'none';
  setStatus('Searching DFK Chain...', 'loading');

  // Try GraphQL first, fallback to RPC
  let dfkHeroes = await fetchHeroesByOwner(wallet, DFK_GRAPH, 'dfkchain');
  if (dfkHeroes.length === 0) {
    setStatus('GraphQL empty, trying RPC on DFK Chain...', 'loading');
    dfkHeroes = await fetchViaRPC(wallet, 'dfkchain');
  }

  setStatus(`DFK Chain: ${dfkHeroes.length}. Searching Metis...`, 'loading');

  let metisHeroes = await fetchHeroesByOwner(wallet, METIS_GRAPH, 'metis');
  if (metisHeroes.length === 0) {
    metisHeroes = await fetchViaRPC(wallet, 'metis');
  }

  const all = [...dfkHeroes, ...metisHeroes];

  document.getElementById('dfkCount').textContent = `DFK: ${dfkHeroes.length}`;
  document.getElementById('metisCount').textContent = `Metis: ${metisHeroes.length}`;
  document.getElementById('totalCount').textContent = `Total: ${all.length}`;
  document.getElementById('chainBadges').style.display = 'flex';

  if (all.length === 0) {
    setStatus('No heroes found. This wallet may have no live heroes, or the data sources are temporarily unavailable.', 'error');
    document.getElementById('searchBtn').disabled = false;
    return;
  }

  setStatus(`Rendering ${all.length} heroes...`, 'loading');
  const grid = document.getElementById('cardsGrid');
  
  for (let i = 0; i < all.length; i++) {
    const div = document.createElement('div');
    div.innerHTML = renderHero(all[i], all[i].chain);
    grid.appendChild(div.firstElementChild);
    if (i % 4 === 0) await new Promise(r => setTimeout(r, 0));
  }

  setStatus(`Legion loaded — ${all.length} heroes`, 'ok');
  document.getElementById('searchBtn').disabled = false;
}

document.getElementById('walletInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadLegion();
});
</script>
